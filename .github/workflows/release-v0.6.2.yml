name: Publish v0.6.2 ZIP release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.6.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package frozen pre-editor source
        run: |
          git archive --format=zip --prefix=LTT-Advocate-v0.6.2/ HEAD -o LTT-Advocate-v0.6.2.zip
          unzip -t LTT-Advocate-v0.6.2.zip
      - name: Create GitHub release and attach ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.2 LTT-Advocate-v0.6.2.zip \
            --target "${GITHUB_SHA}" \
            --title "LTT-Advocate v0.6.2 — Pre-editor snapshot" \
            --notes "Frozen source snapshot before the planned visual layout editor. Includes the guided walkthrough, five broadcast layouts, coin controls, and current producer interface. Experimental prototype; OBS integration is not independently certified. Forced coin controls are intended to mirror a physical coin toss."
