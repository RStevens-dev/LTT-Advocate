name: Vendor LTT logo
on:
  push:
    paths:
      - '.github/workflows/vendor-logo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p assets
          curl --fail --location --retry 3 -A 'LTT-Advocate asset bundler (GitHub)' https://upload.wikimedia.org/wikipedia/commons/7/77/2018_Linus_Tech_Tips_logo.svg -o assets/ltt.svg
          python -c "import xml.etree.ElementTree as E; assert E.parse('assets/ltt.svg').getroot().tag.endswith('svg')"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/ltt.svg
          git diff --cached --quiet || (git commit -m 'Bundle original LTT SVG' && git push)
