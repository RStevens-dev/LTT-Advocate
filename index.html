<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Devil's Advocate</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:#fff;background:#17181c}body.output{background:transparent}button,input,select{font:inherit;color:inherit;background:#292b31;border:1px solid #666;border-radius:5px;padding:8px}button{cursor:pointer}button:disabled{opacity:.4}button.primary{background:#e97842;color:#111}label{display:block;margin:8px 0}input{max-width:100%}main{max-width:1000px;margin:auto;padding:16px}fieldset{border:1px solid #555;margin:12px 0}#screen{position:relative;aspect-ratio:16/9;background:linear-gradient(110deg,#69362f,#24252b,#29466b);container-type:inline-size;overflow:hidden}body.output #screen{width:100vw;height:100vh;aspect-ratio:auto;background:transparent}body.output main{max-width:none;padding:0}body.output #controls{display:none}.header,.position,.timer{background:#111216ed;text-align:center;padding:1cqw;border-radius:4px}.header{border-bottom:2px solid #f47b42;font-size:2.6cqw;font-weight:800}.brand{color:#ff9864;font-size:1.3cqw;letter-spacing:2px}.position{border-top:3px solid #f47b42;font-size:2.3cqw;font-weight:800}.position small{display:block;font-size:1.5cqw;color:#ddd}.active{outline:2px solid #ffb17c;box-shadow:0 0 18px #ff995c}.timer{position:absolute;left:50%;top:45%;transform:translateX(-50%);font-size:4.8cqw;font-weight:900;white-space:nowrap}.timer small{display:block;font-size:1.5cqw;color:#ffb17c}.coin{margin:auto;width:8cqw;height:8cqw;border-radius:50%;background:#d7a54c;color:#4b310e;border:4px double #ffe6a0;display:grid;place-items:center}.spin{animation:spin .16s linear infinite}@keyframes spin{to{transform:rotateY(360deg)}}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1cqw;padding:1cqw}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.urgent{color:#ff6655}.single .header{font-size:5cqw}.single .brand,.single .position small{font-size:3cqw}.single .position{font-size:4.5cqw}.single .timer{font-size:9cqw}.single .timer small{font-size:3cqw}a{color:#ffad82}

/option></select></label><label>Preview <select id="format"><option>wide</option><option>linus</option><option>luke</option><option>stack</option><option>square</option></select></label><div id="links"></div></fieldset><fieldset><legend>Hotkeys</legend><label><input id="enabled" type="checkbox"> Enable shortcuts</label><div id="keys"></div><button id="defaults">Restore defaults</button><button id="export">Export profile</button><label>Import profile <input id="import" type="file" accept=".json"></label><p id="message" role="status"></p></fieldset></section></main><script type="module" src="./app.js"></script></html>
